# Eureka Design fork only (decision D5, ADR-005): runs the checks for the Eureka branches here,
# so the heavy builds don't run on a designer's laptop. The upstream workflows are left as they
# are; this file never goes upstream.
name: Eureka

on:
  push:
    branches: ["claude/eureka-**", "eureka/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eureka-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Text measurement tests need the suite's fonts (same ref as the upstream ci.yml).
  CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
  PACKAGES: >-
    libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev

jobs:
  eureka:
    # The gate for the Eureka changes: the crates they touch, lint-clean, and the layering rule.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: 37827adc41fd165f9a9234ac40f94dbad353aa69
          path: craft-fonts
          lfs: true
      - run: sudo apt-get update && sudo apt-get install -y $PACKAGES
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (engine, mcp, ui)
        run: cargo clippy -p figcraft-engine -p figcraft-mcp -p figcraft-ui-egui --all-targets -- -D warnings
      - name: engine tests
        run: cargo test -p figcraft-engine --lib
      - name: mcp tests
        run: cargo test -p figcraft-mcp
      - name: ui tests (i18n and panels)
        run: cargo test -p figcraft-ui-egui
      - name: layers
        run: cargo xtask layers

  full:
    # The upstream's whole gate (`cargo xtask ci`, wasm included), for information: a failure here
    # that also fails on upstream main is not the Eureka branch's to fix.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: 37827adc41fd165f9a9234ac40f94dbad353aa69
          path: craft-fonts
          lfs: true
      - run: sudo apt-get update && sudo apt-get install -y $PACKAGES
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: cargo xtask ci
        run: cargo xtask ci
